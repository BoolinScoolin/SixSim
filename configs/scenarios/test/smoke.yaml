simulation:
  dt_s: 0.001
  logging_rate_hz: 100.0
  stop_simulation_time_s: 1.0
  integrator: rk4

initial_state:
  rigid_body:
    position_ned_m: [0.0, 0.0, 0.0]
    velocity_body_mps: [0.0, 1.0, 0.0]
    omega_body_rps: [0.0, 0.0, 0.0]
    azimuth_rad: 0.0
    elevation_rad: 0.0
    roll_rad: 0.0

models:
  atmosphere:
    type: constant
    density_kg_per_m3: 1.225
    pressure_pa: 101325.0
    temperature_k: 288.15
    speed_of_sound_m_per_s: 340.3
  wind:
    type: constant
    wind_ned_mps: [0.0, 0.0, 0.0]
  gravity:
    type: constant
    gravity_mps2: 9.80665
  aerodynamics:
    type: zero
  propulsion:
    type: hardcoded_thrust_curve
    thrust_direction_body: [1.0, 0.0, 0.0]

vehicle:
  mass_properties:
    unloaded_mass_kg: 10.0
    inertia_body_kgm2: [1.0, 1.0, 1.0]
